      <stop offset="0%" stop-color="#d8b878" stop-opacity="0.88"/>
      <stop offset="55%" stop-color="#b8925a" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#7a5830" stop-opacity="0.50"/>
    </radialGradient>
    <radialGradient id="gt-head" cx="38%" cy="38%" r="55%">
      <stop offset="0%" stop-color="#c8a060" stop-opacity="0.90"/>
      <stop offset="100%" stop-color="#7a5830" stop-opacity="0.62"/>
