  <rect x="14" y="41" width="5" height="7" rx="2.5" fill="#7a5830" opacity="0.68"/>
  <rect x="21" y="41" width="5" height="7" rx="2.5" fill="#7a5830" opacity="0.62"/>
  <!-- legs back -->
  <rect x="30" y="41" width="5" height="7" rx="2.5" fill="#7a5830" opacity="0.62"/>
