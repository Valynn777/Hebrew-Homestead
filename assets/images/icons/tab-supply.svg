  <!-- small sparkle/craft spark -->
  <circle cx="20" cy="7" r="1.2" fill="#d4b840" opacity="0.48"/>
  <path d="M20 4 L20 5.5" stroke="#d4b840" stroke-width="0.8" stroke-linecap="round" opacity="0.40"/>
  <path d="M17.5 7 L19 7" stroke="#d4b840" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>
  <path d="M22.5 7 L21 7" stroke="#d4b840" stroke-width="0.8" stroke-linecap="round" opacity="0.35"/>
