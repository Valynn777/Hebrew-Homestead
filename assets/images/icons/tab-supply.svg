  <rect x="4" y="8" width="12" height="7" rx="1.5" fill="#7a8a98" opacity="0.70" transform="rotate(-35 10 11)"/>
  <!-- hammer head face shadow -->
  <rect x="4" y="8" width="4" height="7" rx="1" fill="#5a6a78" opacity="0.35" transform="rotate(-35 10 11)"/>
  <!-- hammer handle -->
  <path d="M14 16 C16 19 17 22 16 25" stroke="#c8a060" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.70"/>
