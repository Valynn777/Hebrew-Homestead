  <rect x="4" y="17" width="6" height="5" rx="0.8" fill="#c8a860" opacity="0.48"/>
  <line x1="7" y1="17" x2="7" y2="22" stroke="#a07830" stroke-width="0.7" opacity="0.40"/>
  <!-- window right -->
  <rect x="22" y="17" width="6" height="5" rx="0.8" fill="#c8a860" opacity="0.48"/>
  <line x1="25" y1="17" x2="25" y2="22" stroke="#a07830" stroke-width="0.7" opacity="0.40"/>
  <!-- hay peek inside door -->
  <path d="M12 29 C14 27 18 27 20 29" stroke="#d4a830" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.48"/>
