<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- barn body -->
  <rect x="3" y="14" width="26" height="16" rx="1.5" fill="#9a6a42" opacity="0.68"/>
  <!-- barn body shadow -->
  <rect x="3" y="22" width="26" height="8" rx="1.5" fill="#7a4e2e" opacity="0.28"/>
  <!-- roof left face -->
  <path d="M2 15 L16 4 L16 14 L3 14Z" fill="#b07838" opacity="0.72"/>
  <!-- roof right face -->
  <path d="M30 15 L16 4 L16 14 L29 14Z" fill="#8a5a28" opacity="0.72"/>
  <!-- roof ridge line -->
  <path d="M2 15 L16 4 L30 15" stroke="#6a3e1a" stroke-width="1.2" fill="none" stroke-linejoin="round" opacity="0.55"/>
  <!-- barn door arch -->
  <path d="M11 30 L11 22 Q16 18 21 22 L21 30Z" fill="#5a3418" opacity="0.68"/>
  <!-- door arch top -->
  <path d="M11 22 Q16 18 21 22" fill="#4a2a10" opacity="0.60"/>
